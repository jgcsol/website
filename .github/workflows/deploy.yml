name: Deploy Next.js Static Site to AWS S3 Bucket

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  RECAPTCHA_SECRET: process.env.RECAPTCHA_SECRET

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build and export static site
      - name: Build and export static site
        run: |
          npm run build

      # Configure AWS credentials using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::200962050435:role/GithubWebsiteDeployRole
          aws-region: us-east-1

      # Deploy exported site to S3
      - name: Deploy to S3
        run: |
          aws s3 sync out/ s3://jgcsol.com --delete

      # Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EWNHQ2LG2VEYA \
            --paths "/*"
